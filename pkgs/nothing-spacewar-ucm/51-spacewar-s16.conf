# Spacewar: the PRIMARY_MI2S path to the TFA9873 amps is silent with S24_LE;
# S16_LE plays on both speakers (verified with speaker-test on hw:0,0).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
