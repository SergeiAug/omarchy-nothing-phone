# Based on configurations by Val Packett <val@packett.cool>
# and Luca Weiss <luca.weiss@fairphone.com>.
# Spacewar / common q6voice: не проверено на телефоне.
# Adapted from sc7280-mainline/alsa-ucm-conf dubai and FP5 VoiceCall.conf.
# See README.md for driver file:line references and integration requirements.
# MultiMedia PCMs expose a sink/source to PipeWire; voice stays in the DSP.
SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='PRI_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
	Value.TQ "Voice"
}

SectionDevice."Earpiece" {
	Comment "Top TFA9873 (channel 0)"
	ConflictingDevice [ "Speaker" ]
	EnableSequence [
		cset "name='Earpiece Output Switch' 1"
		cset "name='Speaker Output Switch' 0"
		exec "systemctl --user start dummystreamhack@Rhw:${CardId},${var:VoicePCM}"
	]
	DisableSequence [
		exec "systemctl --user stop dummystreamhack@Rhw:${CardId},${var:VoicePCM}"
		cset "name='Earpiece Output Switch' 1"
		cset "name='Speaker Output Switch' 1"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Speaker" {
	Comment "Bottom TFA9873 (channel 1); echo cancellation unverified"
	ConflictingDevice [ "Earpiece" ]
	EnableSequence [
		cset "name='Earpiece Output Switch' 0"
		cset "name='Speaker Output Switch' 1"
		exec "systemctl --user start dummystreamhack@Rhw:${CardId},${var:VoicePCM}"
	]
	DisableSequence [
		exec "systemctl --user stop dummystreamhack@Rhw:${CardId},${var:VoicePCM}"
		cset "name='Earpiece Output Switch' 1"
		cset "name='Speaker Output Switch' 1"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic1" {
	Comment "Bottom AMIC1 via ADC1 / SWR_MIC0 / DEC0 (woodyst mapping)"
	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
		exec "systemctl --user start dummystreamhack@Thw:${CardId},${var:VoicePCM}"
	]
	DisableSequence [
		exec "systemctl --user stop dummystreamhack@Thw:${CardId},${var:VoicePCM}"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX0 MODE' ADC_INVALID"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureChannels 1
	}
}
