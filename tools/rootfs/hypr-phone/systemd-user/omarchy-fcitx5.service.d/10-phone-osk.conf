# packages/omamobile-shell/systemd/user/omarchy-fcitx5-omamobile.conf
# squeekboard needs Hyprland's single input-method slot, which fcitx5 would
# take. A condition, not a mask: Omarchy's first run enables this unit with
# `enable --now`, which fails on a masked unit and re-runs first run at every
# login. To run fcitx5 anyway: touch ~/.config/omarchy-phone/fcitx5
[Unit]
ConditionPathExists=%h/.config/omarchy-phone/fcitx5
