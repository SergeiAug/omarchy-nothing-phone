# derekross/omarchy-mobile@1155a7c packages/omamobile-shell/environment.d/20-omamobile-osk.conf
# Overrides Omarchy's /usr/lib/environment.d/10-omarchy-fcitx.conf so text
# fields use text-input-v3 (squeekboard) instead of fcitx. environment.d can't
# unset a variable, so the fcitx ones get explicit "no input method" values.
INPUT_METHOD=none
QT_IM_MODULE=wayland
GTK_IM_MODULE=wayland
XMODIFIERS=@im=none
SDL_IM_MODULE=none
